name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test
        env:
          # Tests don't hit live Supabase; these are placeholders that satisfy
          # the module-level validation in supabase.ts during import
          PURVEYORS_SUPABASE_URL: https://placeholder.supabase.co
          PURVEYORS_SUPABASE_ANON_KEY: placeholder-anon-key

      # NOTE: Supabase type staleness check is intentionally omitted here.
      # The check requires SUPABASE_ACCESS_TOKEN and should be added as a
      # separate job once the typegen workflow has been triggered and real
      # types are committed. See .github/workflows/typegen.yml.
