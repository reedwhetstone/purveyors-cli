name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type Check, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test
        env:
          # Tests don't hit live Supabase; these are placeholders that satisfy
          # the module-level validation in supabase.ts during import
          PURVEYORS_SUPABASE_URL: https://placeholder.supabase.co
          PURVEYORS_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Check Supabase types are up to date
        if: github.event_name == 'pull_request'
        run: |
          npx supabase gen types typescript --project-id bjblfzfdtfvuitqdbodn > /tmp/database.types.generated.ts
          if ! diff -q src/types/database.types.ts /tmp/database.types.generated.ts > /dev/null 2>&1; then
            echo "::error::Supabase types are stale. Run the 'Supabase Type Generation' GitHub Actions workflow to regenerate src/types/database.types.ts"
            diff src/types/database.types.ts /tmp/database.types.generated.ts || true
            exit 1
          fi
          echo "Supabase types are up to date."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
